services:
  filestore:
    build: .
    image: filestore:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in the .env file}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      MAX_FILE_GB: ${MAX_FILE_GB:-0}
      CHUNK_MB: ${CHUNK_MB:-64}
      DISK_RESERVE_GB: ${DISK_RESERVE_GB:-0}
    # DATA_PATH: a folder on the server with enough free space, e.g. /srv/filestore.
    # Left empty, Docker keeps the data in a named volume instead.
    volumes:
      - ${DATA_PATH:-filestore-data}:/data

volumes:
  filestore-data:
